{#- The animated pixel-art dawn behind every page. Uses `today` for its daily seed. -#}
<style>
    .backdrop {
      position: fixed;
      inset: 0;
      z-index: -1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(var(--backdrop-dim));
      image-rendering: pixelated;   /* keep the pixels chunky when scaled up */
    }
</style>
<canvas class="backdrop" id="dawn" width="320" height="180" aria-hidden="true"></canvas>
<script>
    // A pixel-art dawn, drawn at 320x180 and scaled up with crisp pixels.
    // Seeded by today's date: the layout stays, but clouds, stars, birds and trees change daily.
    // The sky and hills are drawn once into hidden layers; each frame only adds what moves.
    (() => {
      const canvas = document.getElementById("dawn");
      const g = canvas.getContext("2d");
      const W = canvas.width, H = canvas.height, HORIZON = 118;

      let seed = Number("{{ today }}".replaceAll("-", "")) % 2147483647 || 7;
      const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      const painter = ctx => (x, y, w, h, colour) => { ctx.fillStyle = colour; ctx.fillRect(x, y, w, h); };
      const layer = () => Object.assign(document.createElement("canvas"), { width: W, height: H });

      // ---- Still layer 1: sky and stars ----
      const skyLayer = layer(), sky = painter(skyLayer.getContext("2d"));
      const bands = ["#1d2b45", "#2b3d5c", "#41566f", "#6b6e80", "#a3808a", "#d39a8c", "#eeb48e", "#f6cf9d"];
      const band = HORIZON / bands.length;
      bands.forEach((colour, i) => {
        const top = Math.round(i * band);
        sky(0, top, W, Math.round((i + 1) * band) - top, colour);
        if (i === 0) return;
        for (let x = 0; x < W; x += 2) sky(x, top, 1, 1, bands[i - 1]);       // dithered seam
        for (let x = 1; x < W; x += 4) sky(x, top + 1, 1, 1, bands[i - 1]);
      });
      for (let i = 0; i < 40; i++) {
        sky(Math.floor(rand() * W), Math.floor(rand() * 34), 1, 1, rand() < 0.3 ? "#fff4dc" : "#8f9bb3");
      }

      // ---- Still layers 2-4: far, mid and near hills (transparent above the ridges) ----
      // Separate layers so they can move at different speeds as you scroll (parallax).
      const farLayer = layer(), midLayer = layer(), nearLayer = layer();
      const ridge = (paint, base, rough, colour, wave) => {
        const tops = [];
        let y = base;
        for (let x = 0; x < W; x++) {
          y += (rand() - 0.5) * rough;
          y = Math.max(base - 14, Math.min(base + 10, y));
          const top = Math.round(y + wave(x));
          tops.push(top);
          paint(x, top, 1, H - top, colour);
        }
        return tops;
      };
      const far = painter(farLayer.getContext("2d")), mid = painter(midLayer.getContext("2d"));
      const hill = painter(nearLayer.getContext("2d"));
      ridge(far, HORIZON - 22, 3, "#7c6f78", () => 0);                                     // far mountains
      ridge(mid, HORIZON - 4, 0.6, "#566355", x => Math.sin(x / 23) * 6);                    // mid hills
      const near = ridge(hill, HORIZON + 18, 0.4, "#2c3620", x => Math.sin(x / 37 + 1) * 8); // near hills
      for (let x = 4; x < W; x += 6 + Math.floor(rand() * 10)) {                      // pine trees
        const h = 6 + Math.floor(rand() * 10), base = near[x];
        for (let r = 0; r < h; r++) {
          const half = Math.floor(r / 2);
          hill(x - half, base - h + r, half * 2 + 1, 1, "#212916");
        }
      }
      hill(0, H - 14, W, 14, "#1a2012");                                               // meadow
      for (let x = 0; x < W; x += 3 + Math.floor(rand() * 6)) hill(x, H - 15, 1, 1, "#1a2012");

      // ---- Things that move ----
      const px = painter(g);
      const sunX = Math.round(W * 0.86);
      let sunY = HORIZON - 30;

      // How far through the deck the reader is, 0 at the cover to 1 at the closing card.
      let progress = 0;
      const track = () => {
        const room = document.documentElement.scrollHeight - innerHeight;
        progress = room > 0 ? Math.min(1, Math.max(0, scrollY / room)) : 0;
      };
      addEventListener("scroll", track, { passive: true });
      track();

      // Pages can raise the sun on purpose: the puzzle calls riseSun() when you solve it.
      let lifted = null;
      window.riseSun = (ms = 2500) => {
        const from = progress, start = performance.now();
        const step = now => {
          const t = Math.min(1, (now - start) / ms);
          lifted = from + (1 - from) * (1 - (1 - t) ** 3);     // ease out
          if (t < 1) requestAnimationFrame(step); else if (still) draw(0);
        };
        requestAnimationFrame(step);
        if (still) { lifted = 1; draw(0); }
      };
      const clouds = Array.from({ length: 5 }, () => ({
        x: rand() * W, y: 40 + Math.floor(rand() * 50),
        len: 14 + Math.floor(rand() * 26), speed: 0.6 + rand() * 1.6,   // pixels per second
      }));
      const birds = Array.from({ length: 4 }, () => ({
        x: rand() * W, y: 46 + Math.floor(rand() * 30),
        speed: 7 + rand() * 6, phase: rand() * 10,
      }));
      const WINGS_UP = [[0, 0], [1, 1], [2, 2], [3, 1], [4, 0]];
      const WINGS_DOWN = [[0, 2], [1, 1], [2, 2], [3, 1], [4, 2]];

      const disc = (r, colour, dither) => {
        for (let y = -r; y <= r; y++) {
          for (let x = -r; x <= r; x++) {
            if (x * x + y * y > r * r) continue;
            if (dither && (x + y) % 2) continue;                       // every other pixel: a soft glow
            px(sunX + x, sunY + y, 1, 1, colour);
          }
        }
      };
      const wrap = (x, span) => ((x % span) + span) % span;

      function draw(seconds) {
        g.drawImage(skyLayer, 0, 0);

        // The sun rises as you read: 30 pixels higher by the closing card.
        const p = lifted ?? progress;
        sunY = HORIZON - 30 - Math.round(p * 30);

        // Sun: a dithered halo that breathes in and out by whole pixels.
        const halo = 22 + Math.round((Math.sin(seconds * 1.3) + 1) * 2);
        disc(halo, "#ffe2a8", true);
        disc(20, "#ffd99a");
        disc(15, "#fff1c8");

        for (const c of clouds) {
          const x = Math.round(wrap(c.x + seconds * c.speed, W + 50)) - 50;
          px(x + 3, c.y, c.len - 6, 1, "#fbd9b8");
          px(x, c.y + 1, c.len, 2, "#f6c6a2");
          px(x + 2, c.y + 3, c.len - 4, 1, "#dfa28e");
        }

        for (const b of birds) {
          const x = Math.round(wrap(b.x + seconds * b.speed, W + 20)) - 10;
          const y = b.y + Math.round(Math.sin(seconds * 0.9 + b.phase) * 2);
          const wings = Math.floor(seconds * 4 + b.phase) % 2 ? WINGS_UP : WINGS_DOWN;
          for (const [dx, dy] of wings) px(x + dx, y + dy, 1, 1, "#3b2f38");
        }

        // Hills last, so birds pass behind them. Nearer hills sink further as you scroll.
        g.drawImage(farLayer, 0, Math.round(p * 4));
        g.drawImage(midLayer, 0, Math.round(p * 10));
        g.drawImage(nearLayer, 0, Math.round(p * 18));
      }

      // About 12 frames a second, like an old game. Still image if the visitor prefers less motion.
      const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (still) {
        draw(0);
        return;
      }
      let last = -Infinity;
      const loop = now => {
        if (now - last >= 83) { draw(now / 1000); last = now; }
        requestAnimationFrame(loop);                                   // browsers pause this in hidden tabs
      };
      requestAnimationFrame(loop);
    })();
</script>
