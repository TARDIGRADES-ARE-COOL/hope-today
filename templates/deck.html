<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
</head>
<body>
  <section>
    <h1>{{ title }}</h1>
    <p>You said: {{ user_answer }}</p>
    <p>{{ today }}</p>
  </section>

  {% for story in stories %}
  <section>
    <h2>{{ story.headline }}</h2>
    <p><strong>What happened:</strong> {{ story.summary }}</p>
    <p><strong>Why it matters:</strong> {{ story.why_it_matters }}</p>
    <p>{{ story.date }} · <a href="{{ story.url }}">Read the full story</a></p>
  </section>
  {% endfor %}

  <section>
    <h2>There is hope today.</h2>
  </section>
</body>
</html>
